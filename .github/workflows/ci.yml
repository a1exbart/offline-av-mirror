# Build, test and publish both platforms on every change.
# The same file runs on GitHub Actions and on Gitea Actions.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests

      # upload-artifact v4 talks to an API only github.com implements; on a
      # self-hosted forge it refuses outright. Nothing depends on these
      # artifacts, so they are simply skipped there.
      - uses: actions/upload-artifact@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          name: test-results
          path: artifacts/tests

  publish:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        rid: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # A build from a branch is not a release; it is named after the commit so
      # nobody mistakes it for one.
      - name: Publish ${{ matrix.rid }}
        run: |
          version="0.0.0-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          dotnet publish src/OfflineAvMirror -c Release -r ${{ matrix.rid }} \
            -p:Version=0.0.0 -p:InformationalVersion="$version" \
            -o artifacts/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        if: github.server_url == 'https://github.com'
        with:
          name: offline-av-mirror-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

      - name: Where the build landed
        if: github.server_url != 'https://github.com'
        run: ls -la artifacts/${{ matrix.rid }}
